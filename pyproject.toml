[dependency-groups]
dev = ["ruff==0.17.4", "pytest==9.2.0", "pyyaml==6.0.3"]

# CONTRIBUTING.md 5.4 and 8.2: C2's broad handlers (BLE001, S110, S112, contextlib.suppress) and L1's logging
# forms (G: format in log calls, LOG: root logger and getLogger arguments, logging.basicConfig).
[tool.ruff.lint]
extend-select = ["BLE001", "S110", "S112", "G", "LOG", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "L1: Hermes owns logging configuration"
"contextlib.suppress".msg = "C2: a catch-everything handler BLE001 does not see"
