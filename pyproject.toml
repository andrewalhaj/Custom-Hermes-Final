[dependency-groups]
dev = ["ruff==0.17.4", "pytest==9.2.0", "pyyaml==6.0.3"]

# CONTRIBUTING.md 5.4 and 8.2: C2's broad handlers (BLE001, S110, S112), contextlib.suppress (C2, F3) and L1's logging
# forms (G: format in log calls, LOG: root logger and getLogger arguments, logging.basicConfig, logging.config).
# [tool.ruff.lint] stays last: tests/test_ci_workflow.py appends keys to it.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.basicConfig".msg = "L1: Hermes owns logging configuration"
"logging.config".msg = "L1: dictConfig and fileConfig install log handlers; Hermes owns logging configuration"
"contextlib.suppress".msg = "C2, F3: suppress hides a failure without recording it; catch by name and record it"

[tool.ruff.lint]
extend-select = ["BLE001", "S110", "S112", "G", "LOG", "TID251"]
