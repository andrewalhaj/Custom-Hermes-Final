name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0 }   # the secret scan reads the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with: { python-version: "3.14" }
      - run: pip install --group dev
      - name: install gitleaks 8.30.1, checked against its published checksum
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: no secret in the repository's history
        shell: bash
        run: |
          command -v gitleaks >/dev/null || { echo "secret scan: gitleaks is not installed"; exit 1; }
          errors=$(mktemp)
          # Findings, redacted, go to stdout; at this log level only gitleaks's errors go to stderr.
          # --diff-merges=remerge also shows what a merge commit itself brings in.
          set +e
          gitleaks git --redact --no-banner -v --log-level error --exit-code 1 \
            --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=remerge" . 2>"$errors"
          code=$?
          set -e
          # gitleaks exits 0 when git itself fails: that is no scan, not a clean history.
          if [ -s "$errors" ]; then
            cat "$errors"
            echo "secret scan: gitleaks reported an error, so the history was not scanned"
            exit 1
          fi
          [ "$code" -eq 0 ] || { echo "secret scan: gitleaks found a secret (above, redacted)"; exit "$code"; }
      - run: ruff check .
      - name: no noqa that can silence a protected rule
        shell: bash
        run: |
          # Matches a bare noqa, a noqa naming one of the protected rules (C2: BLE001, S110, E722, S112, TID251;
          # L1: any G or LOG code, TID251), and file-level ruff/flake8 noqa, in any case.
          set +e
          git grep -n -i -E '#[[:space:]]*noqa([[:space:]]*$|[[:space:]]*[^:[:space:]]|:([^#]*[^[:alnum:]#])?(BLE001|S110|E722|S112|TID251|G[0-9]+|LOG[0-9]+)([^[:alnum:]]|$))|(ruff|flake8):[[:space:]]*noqa' -- '*.py'
          rc=$?
          set -e
          # 1 = no match (pass); 0 = the matches printed above; anything else = git failed
          [ "$rc" -eq 1 ] || { echo "noqa ban: git grep exited $rc (0 = the matches above, other = git failed)"; exit 1; }
      - name: no protected rule fires once every suppression comment is ignored
        shell: bash
        run: |
          # The pattern above knows only the comment forms it lists. This asks ruff itself, whatever the form.
          set +e
          out=$(ruff check --no-cache --ignore-noqa --select BLE001,S110,E722,S112,G,LOG,TID251 --output-format concise .)
          rc=$?
          set -e
          echo "$out"
          # 0 = none of the rules fires; 1 = the findings above, each hidden by a comment; anything else = ruff failed or is missing
          [ "$rc" -eq 0 ] || { echo "suppression ban: ruff exited $rc with suppression comments ignored (1 = the findings above)"; exit 1; }
      - name: the error-handling rules are switched on
        shell: bash
        run: |
          # Lint a probe that breaks every selected rule, with the repository's own ruff configuration.
          # Any configuration that turns a rule off (ignore, select, ruff.toml) makes its code disappear.
          set +e
          out=$(ruff check --no-cache --output-format concise --stdin-filename ci_probe.py - <<'PY'
          import contextlib
          import logging
          import logging.config
          import logging.handlers
          try:
              pass
          except Exception:
              pass
          try:
              pass
          except:
              pass
          for _ in ():
              try:
                  pass
              except Exception:
                  continue
          logging.basicConfig()
          logging.handlers.QueueListener(None)
          logging.info("x")
          logging.getLogger(__name__).warning(f"{_}")
          logging.getLogger(__name__).warning("{}".format(_))
          logging.getLogger(__name__).warning("a" + _)
          logging.getLogger(__file__)
          with contextlib.suppress(ValueError):
              pass
          PY
          )
          rc=$?
          set -e
          echo "$out"
          # 1 = findings reported (expected); 0 = the rules are off; anything else = ruff failed or is missing
          [ "$rc" -eq 1 ] || { echo "probe: ruff exited $rc, expected 1 (findings reported)"; exit 1; }
          # ": CODE " is how ruff's concise output frames a finding, so a code quoted in a message does not count.
          for code in BLE001 S110 E722 S112 G001 G003 G004 LOG002 LOG015; do grep -qF ": $code " <<< "$out" || { echo "ruff no longer reports $code"; exit 1; }; done
          for api in logging.basicConfig logging.config logging.handlers.QueueListener contextlib.suppress; do
            grep -qF "\`$api\` is banned" <<< "$out" || { echo "ruff no longer bans $api"; exit 1; }
          done
      - name: no broad handler outside the two wrappers, and no added log handlers
        shell: bash
        run: |
          # BLE001 skips a broad handler that re-raises or logs the exception; C2 bans those too outside the
          # failure module's two wrappers (CONTRIBUTING.md 5.4), under any name the file gives those classes. L1
          # bans adding log handlers: addHandler, a change to any `.handlers` list, an assignment to `lastResort`,
          # or `logging.config` imported by name, none of which ruff sees.
          python - <<'PY'
          import ast, subprocess, sys
          ALLOWED = set()   # "path.py:qualified.name" of the two wrappers, once the failure module has them (C2)
          def broad(t, names):   # nothing (bare), or one of `names`, by any path, alone or in a tuple
              if isinstance(t, ast.Tuple):
                  return any(broad(e, names) for e in t.elts)
              return t is None or (t.attr if isinstance(t, ast.Attribute) else getattr(t, "id", None)) in names
          def broad_names(tree):
              # Exception, BaseException and every name the file gives them: an assignment, a walrus or an
              # `import ... as`, anywhere in the file whatever its scope, followed until no new name turns up.
              names = {"Exception", "BaseException"}
              while True:
                  found = set()
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.Assign, ast.AnnAssign, ast.NamedExpr)) and node.value is not None and broad(node.value, names):
                          targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                          found |= {target.id for target in targets if isinstance(target, ast.Name)}
                      if isinstance(node, ast.ImportFrom):
                          found |= {alias.asname for alias in node.names if alias.name in names and alias.asname}
                  if found <= names:
                      return names
                  names |= found
          bad = []
          def walk(node, path, func, names):
              for child in ast.iter_child_nodes(node):
                  if isinstance(child, ast.ExceptHandler) and broad(child.type, names) and f"{path}:{func}" not in ALLOWED:
                      bad.append(f"broad handler outside the wrappers: {path}:{child.lineno} in {func or 'module'}")
                  if isinstance(child, ast.Call) and isinstance(child.func, ast.Attribute) and (
                          child.func.attr == "addHandler"
                          or child.func.attr in ("append", "extend", "insert") and getattr(child.func.value, "attr", None) == "handlers"):
                      bad.append(f"log handler added: {path}:{child.lineno}")
                  # or put straight into a logger's list, or in place of the last-resort handler:
                  # `x.handlers = ...`, `x.handlers += ...`, `logging.lastResort = ...`
                  targets = child.targets if isinstance(child, ast.Assign) else [getattr(child, "target", None)]
                  if isinstance(child, (ast.Assign, ast.AugAssign, ast.AnnAssign)) and any(getattr(t, "attr", None) in ("handlers", "lastResort") for t in targets):
                      bad.append(f"log handler added: {path}:{child.lineno}")
                  # or logging.config imported by name, which the lint's ban on it cannot see
                  if (isinstance(child, ast.Call) and getattr(child.func, "attr", getattr(child.func, "id", None)) in ("import_module", "__import__")
                          and child.args and isinstance(child.args[0], ast.Constant) and str(child.args[0].value).startswith("logging.config")):
                      bad.append(f"logging.config imported by name: {path}:{child.lineno}")
                  named = isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
                  walk(child, path, (f"{func}.{child.name}" if func else child.name) if named else func, names)
          for path in subprocess.run(["git", "ls-files", "-z", "*.py"], check=True, capture_output=True, text=True).stdout.split("\0")[:-1]:
              tree = ast.parse(open(path, encoding="utf-8").read(), path)
              walk(tree, path, None, broad_names(tree))
          sys.exit("\n".join(bad) if bad else 0)
          PY
      - name: ruff lints every tracked Python file
        shell: bash
        run: |
          # Catches anything that drops files from linting: include, exclude, .gitignore, ruff's default excludes.
          python - <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path.cwd().resolve()
          run = lambda *cmd: subprocess.run(cmd, check=True, capture_output=True, text=True).stdout.splitlines()
          linted = {pathlib.Path(p).resolve().relative_to(root).as_posix() for p in run("ruff", "check", "--show-files", ".") if p.strip()}
          missing = sorted(set(run("git", "ls-files", "*.py")) - linted)
          sys.exit("tracked Python files that ruff does not lint:\n" + "\n".join(missing) if missing else 0)
          PY
      - name: ruff configuration lives in the root pyproject.toml and narrows nothing
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys, tomllib
          if not os.path.exists("pyproject.toml"):
              sys.exit("no pyproject.toml at the repository root")
          rules = ("BLE001", "S110", "E722", "S112", "G", "LOG", "TID251")
          def covers(code):   # a prefix of a rule ("E", "ALL"), or a code inside a selected family ("G004")
              return code == "ALL" or any(r.startswith(code) or code.startswith(r) for r in rules)
          tracked = subprocess.run(["git", "ls-files", "*ruff.toml", "*pyproject.toml"],
                                   check=True, capture_output=True, text=True).stdout.split()
          bad = [f"ruff configuration outside the root pyproject.toml: {f}" for f in tracked if f != "pyproject.toml"]
          ruff = tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("ruff", {})
          bad += [f"extend: {ruff['extend']}"] if "extend" in ruff else []   # a second settings file the checks below never read
          for section in (ruff, ruff.get("lint", {})):
              for key in ("exclude", "extend-exclude"):
                  bad += [f"{key}: {pattern}" for pattern in section.get(key, [])]
              bad += [f"select: {c}" for c in section.get("select", [])]   # replaces the defaults; use extend-select (8.2)
              for key in ("ignore", "extend-ignore"):
                  bad += [f"{key}: {c}" for c in section.get(key, []) if covers(c)]
              for key in ("per-file-ignores", "extend-per-file-ignores"):
                  bad += [f"{key}: {glob}: {c}" for glob, codes in section.get(key, {}).items() for c in codes if covers(c)]
          sys.exit("\n".join(bad) if bad else 0)
          PY
      - run: python -m pytest -q
  review:   # the independent review (CONTRIBUTING.md W6); not a required check
    # Only where the secret can be read: not a pull request from a fork, not one Dependabot opened.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a hung reviewer must not hold a runner for hours
    concurrency:   # a new push replaces the review of the old one; each review draws on the subscription
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # the commit this run is for
          fetch-depth: 0   # the script diffs against origin/main
          persist-credentials: false   # keep the job's token out of .git/config, which the reviewer can read
      - name: name the checkout as the branch
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # The script checks that the branch is checked out by name. Git would read a dash-led name as an option.
          case "$BRANCH" in
            -*) echo "the branch name begins with a dash: git would read it as an option"; exit 1 ;;
          esac
          git checkout -B "$BRANCH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with: { python-version: "3.14" }
      - run: npm install --global @anthropic-ai/claude-code@2.1.322
      - name: find the issue this pull request closes
        id: issue
        shell: bash
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os, re, sys
          found = re.search(r"(?im)^closes #(\d+)\b", os.environ["BODY"])
          if not found:
              sys.exit("no 'Closes #<n>' line in the pull request body (CONTRIBUTING.md W7)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"issue={found.group(1)}\n")
          PY
      - name: read the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; kept out of the step that runs the reviewer
          ISSUE: ${{ steps.issue.outputs.issue }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        # The script writes the issue with its comments, as a local run does: each comment under a header taken
        # from GitHub's record of who wrote it, and every line of its text quoted.
        run: python scripts/review.py "$BRANCH" "$ISSUE" --print-issue > "$RUNNER_TEMP/issue.txt"
      - name: review the branch
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # the Claude subscription; this step only
          BRANCH: ${{ github.event.pull_request.head.ref }}
          ISSUE: ${{ steps.issue.outputs.issue }}
        run: |
          # The report, with any reason it is incomplete (stderr), goes to the log and to the job summary.
          set +e
          python scripts/review.py "$BRANCH" "$ISSUE" --issue-file "$RUNNER_TEMP/issue.txt" > "$RUNNER_TEMP/review.txt" 2>&1
          code=$?
          set -e
          # The report is model output. The runner must not act on a line in it that looks like a workflow command.
          token=$(python -c 'import secrets; print(secrets.token_hex(16))')
          echo "::stop-commands::$token"
          cat "$RUNNER_TEMP/review.txt"
          echo "::$token::"
          # The job summary gets the report as one text block. GitHub refuses a summary over about 1 MiB, so a
          # longer report is cut there; the log above has all of it.
          python - "$RUNNER_TEMP/review.txt" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import re, sys
          data = open(sys.argv[1], "rb").read()
          text = data[:900000].decode("utf-8", errors="replace")   # a byte that is not UTF-8 shows as U+FFFD
          if len(data) > 900000:
              text = text.rstrip("\ufffd")   # the cut may fall inside a character
              text += "\n[report cut here: it is too long for a job summary; the job log has all of it]"
          fence = "~" * (max(map(len, re.findall("~+", text)), default=7) + 1)   # nothing in the report can close it
          sys.stdout.buffer.write(f"{fence}text\n{text.rstrip(chr(10))}\n{fence}\n".encode("utf-8"))
          PY
          # 0 = ship; 3 = fix first; 4 = an incomplete report; anything else = the review did not run
          exit "$code"
